run_as shiny;

# Shiny Server deletes a worker's log the moment that worker exits cleanly, so
# the only logs that survive are from sessions that crashed *and* happened to be
# looked at before the next clean exit. That makes an intermittent
# "application exited during initialization" effectively undebuggable: by the
# time anyone notices, the evidence is gone. Keep every worker log instead.
# Note this never cleans up — one file per session, forever.
preserve_logs true;

server {
  listen 3838;

  location / {
    app_dir /srv/shiny-server;
    log_dir /var/log/shiny-server;

    # Default is 60s, which a geospatial app can blow through just loading
    # packages: sf pulls in GEOS/GDAL/PROJ, and terra/raster/sp/plotly on top of
    # that all have to attach before the worker reports "Listening on ...".
    # A worker that misses the window is killed and the user sees
    # "The application exited during initialization" instead of the dashboard.
    app_init_timeout 300;
  }
}
