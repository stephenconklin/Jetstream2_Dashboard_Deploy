# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The guide itself lives entirely in docs/user-guide/. This file and
# mkdocs.yml sit at the repo root because Read the Docs looks for the
# former here, and MkDocs resolves docs_dir relative to the latter.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # Material's git-revision-date plugin needs real history, and RTD
      # clones shallow by default.
      - git fetch --unshallow || true

mkdocs:
  configuration: mkdocs.yml
  # Not --strict: a warning about an anchor in the reference section should
  # not take the whole site offline for researchers who need it.
  fail_on_warning: false

python:
  install:
    - requirements: docs/user-guide/requirements.txt
